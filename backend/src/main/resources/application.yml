spring:
  application:
    name: flavorique

  datasource:
    url: jdbc:postgresql://localhost:5432/flavorique
    username: flavorique_user
    password: flavorique_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:flavorique-super-secret-key-for-jwt-token-generation-minimum-256-bits}
  expiration: 86400000
  refresh-expiration: 604800000

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    dev.arubik.flavorique: DEBUG
    org.springframework.security: DEBUG

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:flavorique;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

# Admin user configuration (can be overridden by environment variables)
app:
  admin:
    username: ${ADMIN_USERNAME:Arubik}
    email: ${ADMIN_EMAIL:arubik4u@gmail.com}
    password: ${ADMIN_PASSWORD:Admin}

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

---
spring:
  config:
    activate:
      on-profile: render

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:flavorique-super-secret-key-for-jwt-token-generation-minimum-256-bits}

app:
  admin:
    username: ${ADMIN_USERNAME:Arubik}
    email: ${ADMIN_EMAIL:arubik4u@gmail.com}
    password: ${ADMIN_PASSWORD:Admin123!}

logging:
  level:
    dev.arubik.flavorique: INFO
    org.springframework.security: WARN
