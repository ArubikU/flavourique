<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF7ED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFEDD5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FB923C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="530" r="150" fill="#FED7AA" opacity="0.5"/>
  <circle cx="1100" cy="100" r="100" fill="#FED7AA" opacity="0.5"/>
  
  <!-- Logo icon -->
  <g transform="translate(450, 150)">
    <circle cx="150" cy="150" r="120" fill="url(#logo-grad)"/>
    <g fill="#FFFFFF" transform="translate(70, 70) scale(0.65)">
      <rect x="160" y="120" width="50" height="272" rx="8"/>
      <rect x="160" y="120" width="192" height="50" rx="8"/>
      <rect x="160" y="220" width="140" height="45" rx="8"/>
      <ellipse cx="380" cy="160" rx="20" ry="35" opacity="0.8"/>
      <ellipse cx="340" cy="140" rx="15" ry="28" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="600" y="450" font-family="Inter, sans-serif" font-size="72" font-weight="700" fill="#262626" text-anchor="middle">
    Flavorique
  </text>
  <text x="600" y="520" font-family="Inter, sans-serif" font-size="28" font-weight="400" fill="#737373" text-anchor="middle">
    Descubre y comparte recetas deliciosas
  </text>
</svg>
