version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: flavorique-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flavorique
      POSTGRES_USER: flavorique_user
      POSTGRES_PASSWORD: flavorique_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flavorique_user -d flavorique"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flavorique-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flavorique-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flavorique
      SPRING_DATASOURCE_USERNAME: flavorique_user
      SPRING_DATASOURCE_PASSWORD: flavorique_secret
      JWT_SECRET: flavorique-super-secret-key-for-jwt-token-generation-minimum-256-bits-production
      ADMIN_USERNAME: Arubik
      ADMIN_EMAIL: arubik4u@gmail.com
      ADMIN_PASSWORD: Admin123!
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - flavorique-network

  # Angular Frontend
  frontend:
    build:
      context: ./frontend/flavorique-app
      dockerfile: Dockerfile
    container_name: flavorique-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - flavorique-network

  # Adminer - Database GUI (optional, for development)
  adminer:
    image: adminer:latest
    container_name: flavorique-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - flavorique-network
    profiles:
      - dev

networks:
  flavorique-network:
    driver: bridge
    name: flavorique-network

volumes:
  postgres_data:
    name: flavorique_postgres_data
