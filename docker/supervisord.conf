[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=java -jar /app/app.jar --spring.profiles.active=docker
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=SPRING_DATASOURCE_URL="%(ENV_SPRING_DATASOURCE_URL)s",SPRING_DATASOURCE_USERNAME="%(ENV_SPRING_DATASOURCE_USERNAME)s",SPRING_DATASOURCE_PASSWORD="%(ENV_SPRING_DATASOURCE_PASSWORD)s",JWT_SECRET="%(ENV_JWT_SECRET)s"
